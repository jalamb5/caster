<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caster">
<meta name="theme-color" content="#16120a">
<meta name="color-scheme" content="dark">
<title>Caster — podcasts and audiobooks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
:root{
  --bg:#16120a; --surface:#1f1910; --surface2:#2a2115; --line:#352a19;
  --text:#f2e7d0; --muted:#b3a184; --accent:#ffa02e; --accent-ink:#1c1204;
  --ok:#a8d97f; --danger:#e07050; --radius:18px;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(120% 90% at 50% 0%, #1e1810 0%, var(--bg) 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.5;
  min-height:100dvh; padding-bottom:100px;
  -webkit-user-select:none; user-select:none;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.glow{color:var(--accent); text-shadow:0 0 10px rgba(255,160,46,.55);}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}
header{
  position:sticky; top:0; z-index:20; backdrop-filter:blur(14px);
  background:rgba(22,18,10,.85); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.head{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:520px;margin:0 auto;}
.head h1{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:20px; margin:0; font-weight:700; letter-spacing:.35em;
  color:var(--accent); text-shadow:0 0 12px rgba(255,160,46,.5);
}
.head .sp{flex:1;}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:14px; padding:12px 18px; font-size:15px; cursor:pointer;
  min-height:46px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.chip.on{color:var(--accent); border-color:rgba(255,160,46,.7); text-shadow:0 0 8px rgba(255,160,46,.4);}
.chip.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; box-shadow:0 4px 18px rgba(255,160,46,.35);}
.iconbtn{
  width:48px;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:19px;cursor:pointer;display:grid;place-items:center;
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.shuffle-all{cursor:pointer;background:linear-gradient(140deg,#2b2010 0%,var(--surface) 65%);border-color:rgba(255,160,46,.35);}
.shuffle-all:active{transform:scale(.985);}
.shuffle-all .sa-icon{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 0 22px rgba(255,160,46,.45);}
.muted{color:var(--muted);}
.small{font-size:13.5px;}
.empty{text-align:center;padding:56px 20px;color:var(--muted);}
.empty .big{font-size:42px;margin-bottom:12px;}

.show{display:flex;gap:14px;align-items:center;cursor:pointer;padding:12px 8px;border-radius:14px;min-height:76px;transition:background .15s;}
.show:active{background:var(--surface2);}
.show img{width:56px;height:56px;border-radius:14px;background:var(--surface2);object-fit:cover;flex:none;}
.show .t{font-weight:600;font-size:16px;}
.show .s{font-size:13.5px;color:var(--muted);}

.detail-head{display:flex;gap:16px;align-items:center;margin:18px 0 6px;}
.detail-head img{width:84px;height:84px;border-radius:20px;background:var(--surface2);object-fit:cover;}
.detail-head .t{font-size:21px;font-weight:700;line-height:1.2;}
.shuffle-btn{
  width:100%;padding:18px;border-radius:var(--radius);border:none;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 8px;min-height:60px;
  box-shadow:0 6px 26px rgba(255,160,46,.35);
}
.shuffle-btn:active{transform:scale(.985);}
.statline{text-align:center;font-size:13.5px;color:var(--muted);margin:0 0 16px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.refresh{display:flex;justify-content:flex-end;margin-bottom:10px;}
.ep{padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center;min-height:52px;}
.ep:last-child{border-bottom:none;}
.ep .title{flex:1;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ep.heard .title{color:var(--muted);}
.ep .dur{font-size:13px;color:var(--muted);flex:none;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.ep .dlbtn{flex:none;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1;}
.ep .dlbtn:hover,.ep .dlbtn:focus{background:var(--surface2);color:var(--text);}
.ep .dlbtn.dl-done{color:var(--ok);}
.ep .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,160,46,.6);align-self:center;}
.ep.heard .dot{background:var(--surface2);box-shadow:none;}

.pbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(31,25,16,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
.pbar .inner{max-width:520px;margin:0 auto;display:flex;gap:14px;align-items:center;cursor:pointer;}
.pbar img{width:50px;height:50px;border-radius:12px;background:var(--surface2);object-fit:cover;flex:none;}
.pbar .meta{flex:1;min-width:0;}
.pbar .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar .ctr{display:flex;gap:4px;align-items:center;}
.pbar .ctr button{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:12px;line-height:1;min-width:52px;min-height:52px;}
.pbar .prog{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line);}
.pbar .prog .fill{height:100%;background:var(--accent);width:0%;box-shadow:0 0 8px rgba(255,160,46,.7);}

.overlay{
  position:fixed;inset:0;z-index:40;background:rgba(14,11,6,.97);backdrop-filter:blur(22px);
  display:none;flex-direction:column;padding:26px 24px calc(20px + env(safe-area-inset-bottom));
}
.overlay.open{display:flex;}
.overlay .top{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-top:env(safe-area-inset-top);}
.overlay .art{width:min(62vw,260px);aspect-ratio:1;border-radius:26px;background:var(--surface2);object-fit:cover;margin:2vh auto 20px;display:block;box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,160,46,.15);}
.overlay .ot{font-size:20px;font-weight:700;text-align:center;line-height:1.3;}
.overlay .os{font-size:14px;color:var(--muted);text-align:center;margin-top:6px;}
.track{height:30px;display:flex;align-items:center;cursor:pointer;margin:18px 0 2px;touch-action:none;}
.track .rail{position:relative;height:6px;border-radius:99px;background:var(--surface2);flex:1;}
.track .rail .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);box-shadow:0 0 10px rgba(255,160,46,.6);}
.track .rail .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,160,46,.22),0 0 14px rgba(255,160,46,.6);}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.controls{display:flex;justify-content:center;align-items:center;gap:30px;margin:14px 0 6px;}
.controls button{background:none;border:none;color:var(--text);cursor:pointer;}
.controls .seek{font-size:17px;padding:14px;color:var(--muted);min-width:64px;min-height:56px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.controls .skip{font-size:34px;padding:14px;min-width:72px;min-height:64px;}
.controls .pp{font-size:60px;padding:6px;color:var(--accent);text-shadow:0 0 18px rgba(255,160,46,.55);min-width:88px;min-height:76px;}
.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px;}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,4,.85);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto;padding-top:calc(20px + env(safe-area-inset-top));}
.sheet h2{margin:0 0 14px;font-size:18px;}
.sheet .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;padding:2px 8px;}
input[type=text],input[type=url],input[type=search]{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:15px;font-size:16px;margin:6px 0 12px;outline:none;min-height:52px;
}
input[type=text]:focus,input[type=url]:focus,input[type=search]:focus{border-color:var(--accent);}
.searchres{max-height:44dvh;overflow:auto;}
.sr{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:14px;cursor:pointer;min-height:64px;}
.sr:active{background:var(--surface2);}
.sr img{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--surface2);}
.sr .t{font-size:15px;font-weight:600;}
.sr .s{font-size:12.5px;color:var(--muted);}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin:4px 0 12px;gap:4px;}
.seg button{flex:1;border:none;background:none;color:var(--muted);padding:12px;border-radius:11px;font-size:15px;cursor:pointer;min-height:48px;}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700;}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 4px;}
input[type=range]{width:100%;accent-color:var(--accent);}
.pillrow{display:flex;flex-wrap:wrap;gap:10px;}
.pillrow .chip{padding:12px 18px;font-size:15px;min-height:48px;}
.pillrow .chip.on{color:var(--accent);border-color:rgba(255,160,46,.7);text-shadow:0 0 8px rgba(255,160,46,.4);}
.hint{font-size:12.5px;color:var(--muted);margin-top:-4px;margin-bottom:10px;}
.toast{
  position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:60;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:13px 20px;border-radius:99px;font-size:14.5px;opacity:0;pointer-events:none;
  transition:opacity .25s;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

</style>
</head>
<body>

<header>
  <div class="head">
    <h1>CASTER</h1>
    <span class="sp"></span>
    <button class="chip mono" id="sleepChip" title="Sleep timer">⏾ off</button>
    <button class="iconbtn" id="addBtn" title="Add a show">＋</button>
    <button class="iconbtn" id="booksBtn" title="Harry Potter audiobooks">📚</button>
    <button class="iconbtn" id="setBtn" title="Settings">⚙</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<!-- player bar -->
<div class="pbar" id="pbar" style="display:none">
  <div class="prog"><div class="fill" id="pbarFill"></div></div>
  <div class="inner" id="pbarOpen">
    <img id="pbarArt" alt="">
    <div class="meta">
      <div class="t" id="pbarTitle"></div>
      <div class="s" id="pbarShow"><span id="pbarCached" style="display:none;color:var(--ok);font-size:11px;margin-right:4px">✓ cached</span></div>
    </div>
    <div class="ctr">
      <button id="pbarPrev" title="Previous chapter" style="display:none">⏮</button>
      <button id="pbarSkip" title="Skip to a new random episode">⏭</button>
      <button id="pbarPlay" title="Play / pause">▶</button>
    </div>
  </div>
</div>

<!-- now playing -->
<div class="overlay" id="overlay">
  <div class="top">
    <button class="iconbtn" id="ovClose">▾</button>
    <span class="sp" style="flex:1"></span>
    <button class="chip mono" id="ovSleep">⏾</button>
  </div>
  <img class="art" id="ovArt" alt="">
  <div class="ot" id="ovTitle"></div>
  <div class="os" id="ovShow"></div>
  <div class="track" id="track"><div class="rail"><div class="fill" id="ovFill"></div><div class="knob" id="ovKnob"></div></div></div>
  <div class="times"><span id="ovCur">0:00</span><span id="ovDur">–:––</span></div>
  <div class="controls">
    <button class="seek" id="back15">⟲ 15</button>
    <button class="skip" id="ovPrev" style="display:none" aria-label="Previous chapter">⏮</button>
    <button class="pp" id="ovPlay">▶</button>
    <button class="skip" id="ovNext">⏭</button>
    <button class="seek" id="fwd30">30 ⟳</button>
  </div>
  <div class="row">
    <button class="chip" id="speedChip">1×</button>
    <button class="chip" id="restartChip">↺ Restart ep</button>
    <button class="chip" id="markHeardChip">✓ Mark heard</button>
  </div>
</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <span class="close" id="modalClose">✕</span>
    <h2 id="modalTitle">Add a show</h2>
    <div id="modalBody"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<div class="toast" id="toast"></div>

<script type="module">
import { JellyfinClient, createDeviceId, nextChapter, ticksToSeconds, secondsToTicks, buildStreamUrl, normalizeServerUrl, genericNormalizeChapters } from './jellyfin.mjs?v=2';
import { appendEvent, loadEvents, groupEventsByNight, analyzeNight, summarizeNight, pruneOldEvents, localDate } from './sleep.mjs';
'use strict';
/* ============================================================
   Caster — shuffle your podcasts. Single-file PWA.
   Core idea: weighted random that favours unplayed episodes,
   never excludes played ones, and keeps rolling all night.
   ============================================================ */

/* ---------- state & persistence ---------- */
const LS_KEY = 'caster.v1';
let state;
function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ state = JSON.parse(raw); } }catch(e){}
  if(!state || !state.shows) state = { shows:[], settings:{ freshness:60, repeatGuardHours:6, customProxy:'' } };
  state.settings = Object.assign({ freshness:60, repeatGuardHours:6, customProxy:'' }, state.settings||{});
  state.bundledUpdated = state.bundledUpdated || '';
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed', e); } }
loadState();

/* ---------- offline download cache ---------- */
const CACHE_NAME = 'caster-audio-v1';
const DL_KEY = 'caster.downloads.v1';
let dlState = new Set();  // set of downloaded episode GUIDs
let dlInProgress = new Set();  // currently downloading
try{
  const raw = localStorage.getItem(DL_KEY);
  if(raw) JSON.parse(raw).forEach(g => dlState.add(g));
}catch(e){}

function saveDlState(){
  try{ localStorage.setItem(DL_KEY, JSON.stringify([...dlState])); }catch(e){}
}
function isDownloaded(guid){ return dlState.has(guid) && !dlInProgress.has(guid); }
function dlProgress(guid){ return dlInProgress.has(guid); }

async function startDownload(ep){
  if(!ep || !ep.url || dlState.has(ep.guid) || dlInProgress.has(ep.guid)) return;
  dlInProgress.add(ep.guid); renderAll();
  try{
    const resp = await fetch(ep.url);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const cache = await caches.open(CACHE_NAME);
    // Clone so we can store one copy and use the blob
    const clone = resp.clone();
    await cache.put(new Request(ep.url), clone);
    dlState.add(ep.guid);
  }catch(e){
    console.warn('Download failed:', ep.guid, e);
    toast('Download failed: ' + (ep.title||'').substring(0,30));
  }
  dlInProgress.delete(ep.guid);
  saveDlState();
  renderAll();
}

async function removeDownload(ep){
  if(!ep || !ep.url) return;
  const cache = await caches.open(CACHE_NAME);
  await cache.delete(ep.url);
  dlState.delete(ep.guid);
  saveDlState();
  renderAll();
}

async function getCachedBlobUrl(ep){
  if(!ep || !ep.url || !dlState.has(ep.guid)) return null;
  try{
    const cache = await caches.open(CACHE_NAME);
    const resp = await cache.match(ep.url);
    if(!resp) return null;
    const blob = await resp.blob();
    return URL.createObjectURL(blob);
  }catch(e){ return null; }
}

async function downloadPendingUrls(){
  const caches = await caches.open(CACHE_NAME);
  const keys = await caches.keys();
  return keys.map(r => r.url);
}

let cachedBlobUrl = null;
function revokeCachedBlob(){
  if(cachedBlobUrl){ URL.revokeObjectURL(cachedBlobUrl); cachedBlobUrl = null; }
}

async function downloadRandomBatch(count = 5){
  const candidates = state.shows.flatMap(s => s.episodes)
    .filter(e => !dlState.has(e.guid) && !dlInProgress.has(e.guid));
  if(!candidates.length){ toast('All episodes already downloaded'); return; }
  const batch = [];
  // Pick random unplayed ones where possible
  const unplayed = candidates.filter(e => !e.isPlayed && !(e.playCount>0));
  const pool = unplayed.length >= count ? unplayed : candidates;
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, count);
  for(const ep of shuffled){
    dlInProgress.add(ep.guid);
    batch.push(ep);
  }
  renderAll();
  let ok = 0;
  for(const ep of batch){
    try{
      const resp = await fetch(ep.url);
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const cache = await caches.open(CACHE_NAME);
      const clone = resp.clone();
      await cache.put(new Request(ep.url), clone);
      dlState.add(ep.guid);
      ok++;
    }catch(e){
      console.warn('Download failed:', ep.guid, e);
    }
    dlInProgress.delete(ep.guid);
    saveDlState();
    renderAll();
  }
  toast(`Downloaded ${ok}/${batch.length} episodes`);
}

/* ---------- bundled shows (static feeds.json, committed to the repo) ----------
   The hosted app has no proxy, so the favourite shows ship as pre-fetched data.
   On boot we fetch feeds.json, refresh each bundled show's episode list, and
   carry over play state (isPlayed / playCount / lastPlayedAt / position) by
   episode guid. New episodes appear after `python3 refresh_feeds.py` + push. */
async function loadBundledShows(){
  try{
    const r = await fetch('feeds.json?v=2');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.bundledUpdated = data.updated || '';
    const activeFeeds = new Set(data.shows.map(s => s.feedUrl));
    // Remove bundled shows that were removed from feeds.json
    if(state.bundledFeeds){
      const oldBundle = new Set(state.bundledFeeds);
      state.shows = state.shows.filter(s => !oldBundle.has(s.feedUrl) || activeFeeds.has(s.feedUrl));
    }
    state.bundledFeeds = [...activeFeeds];
    for(const bs of data.shows || []){
      const ex = state.shows.find(s => s.feedUrl === bs.feedUrl);
      const oldMap = ex ? new Map(ex.episodes.map(e => [e.guid, e])) : new Map();
      const eps = (bs.episodes || []).map(ne => {
        const old = oldMap.get(ne.guid);
        return Object.assign(ne, old
          ? { isPlayed: old.isPlayed, playCount: old.playCount, lastPlayedAt: old.lastPlayedAt, position: old.position }
          : { isPlayed: false, playCount: 0, lastPlayedAt: 0, position: 0 });
      });
      if(ex){
        ex.title = bs.title; ex.author = bs.author;
        ex.artwork = bs.artwork || ex.artwork;
        ex.episodes = eps;
      } else {
        state.shows.push({ id: bs.feedUrl, feedUrl: bs.feedUrl, title: bs.title, author: bs.author, artwork: bs.artwork, episodes: eps });
      }
    }
    saveState();
  }catch(e){ /* offline or first load — user-added shows still work */ }
}

const $ = s => document.querySelector(s);
const audio = $('#audio');
const now = () => Date.now();
const day = 864e5;

/* ---------- the algorithm (the heart) ---------- */
function episodeWeight(ep, t=now()){
  const heard = ep.isPlayed || (ep.playCount||0) > 0;
  if(!heard) return 10;                                    // never heard → strong preference
  const days = Math.max(0, (t - (ep.lastPlayedAt||t)) / day);
  return 1 + 4 * Math.exp(-days / state.settings.freshness); // decays, never reaches 0 → never excluded
}
function pickEpisode(show, excludeGuid, t=now()){
  const guard = state.settings.repeatGuardHours * 36e5;
  let pool = (show.episodes||[]).filter(e => e.url && e.guid !== excludeGuid);
  if(!pool.length) return null;
  const notFresh = pool.filter(e => e.lastPlayedAt && t - e.lastPlayedAt < guard);
  if(notFresh.length < pool.length) pool = pool.filter(e => !notFresh.includes(e));
  const total = pool.reduce((s,e) => s + episodeWeight(e,t), 0);
  let r = Math.random() * total;
  for(const e of pool){ r -= episodeWeight(e,t); if(r <= 0) return e; }
  return pool[pool.length-1];
}
/* Shuffle across ALL shows: pick the show first, weighted by unplayed count
   (so a show with lots of unheard episodes dominates), then a weighted episode
   inside it. An all-heard show still gets a share — never excluded. */
function pickAcrossShows(t=now()){
  const shows = state.shows.filter(s => (s.episodes||[]).some(e => e.url));
  if(!shows.length) return null;
  const weight = s => 1 + unplayedCount(s) * 2;
  const total = shows.reduce((a,s) => a + weight(s), 0);
  let r = Math.random() * total;
  for(const s of shows){ r -= weight(s); if(r <= 0) return {show: s, ep: pickEpisode(s, null, t)}; }
  const s = shows[shows.length-1];
  return {show: s, ep: pickEpisode(s, null, t)};
}
function markHeard(ep, t=now()){            // started or skipped → sinks for a while
  ep.playCount = (ep.playCount||0) + 1;
  ep.lastPlayedAt = t;
  if(!ep.isPlayed && ep.position && ep.position > 0 && ep.duration && ep.position/ep.duration >= 0.85){
    ep.isPlayed = true;
  }
}
function markPlayedIfDone(){
  const ep = current();
  if(!ep || !ep.duration || ep.isPlayed) return;
  if(audio.currentTime / ep.duration >= 0.85){ ep.isPlayed = true; ep.position = 0; saveState(); renderAll(); }
}

/* ---------- RSS ---------- */
function parseDuration(s){
  if(!s) return 0;
  s = String(s).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const p = s.split(':').map(Number);
  if(p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length === 2) return p[0]*60 + p[1];
  return 0;
}
function parseFeed(xml, feedUrl){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('Not a valid RSS feed');
  const ch = doc.querySelector('channel') || doc;
  // getElementsByTagName matches qualified names (itunes:…) reliably everywhere;
  // querySelector('itunes\\:duration') namespace handling is browser-dependent.
  const qn = (node, name) => { const els = node.getElementsByTagName(name); return els.length ? els[0] : null; };
  const txt = (node, name) => { const n = qn(node, name); return n ? n.textContent.trim() : ''; };
  const title = txt(ch, 'title') || feedUrl;
  const author = txt(ch, 'itunes:author') || txt(ch, 'dc:creator');
  let artwork = '';
  const iimg = qn(ch, 'itunes:image');
  if(iimg) artwork = iimg.getAttribute('href') || '';
  if(!artwork){ const imgel = qn(ch, 'image'); if(imgel) artwork = txt(imgel, 'url'); }
  const episodes = [];
  const seen = new Set();
  const items = doc.getElementsByTagName('item');
  for(let i = 0; i < items.length; i++){
    const item = items[i];
    const t = txt(item, 'title');
    const enc = qn(item, 'enclosure') || qn(item, 'media:content');
    const url = enc ? enc.getAttribute('url') : '';
    if(!url) continue;
    let guid = txt(item, 'guid') || url;
    guid = guid.trim();
    if(seen.has(guid)) continue; seen.add(guid);
    const dur = parseDuration(txt(item, 'itunes:duration'));
    const pd = txt(item, 'pubDate');
    episodes.push({
      guid, title: t, url,
      duration: dur, pubDate: pd ? new Date(pd).getTime() : 0,
      isPlayed:false, playCount:0, lastPlayedAt:0, position:0
    });
  }
  episodes.sort((a,b) => (b.pubDate||0) - (a.pubDate||0));
  return { title, author, artwork, episodes };
}

/* ---------- fetch with CORS fallback chain ----------
   Order: direct → same-origin /fetch (serve.py) → public proxies → custom.
   Each attempt gets its own timeout so one dead proxy can't eat the budget. */
async function fetchWithCors(url){
  const attempts = [
    ['direct', url],
    ['local', '/fetch?url=' + encodeURIComponent(url)],
    ['allorigins', 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)],
    ['corsproxy', 'https://corsproxy.io/?url=' + encodeURIComponent(url)],
    ['codetabs', 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)],
  ];
  if(state.settings.customProxy) attempts.push(['custom', state.settings.customProxy + encodeURIComponent(url)]);
  let lastErr;
  for(const [name, u] of attempts){
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 12000);
    try{
      const r = await fetch(u, {signal: ac.signal});
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      if(/^\s*<!doctype html/i.test(text) || /^\s*<html/i.test(text)) throw new Error('got HTML, not a feed');
      return {kind: name, text};
    }catch(e){ clearTimeout(t); lastErr = e; }
  }
  throw new Error('Could not fetch the feed (CORS). Run "python3 serve.py" in ~/repos/caster and use the same URL, or set a custom proxy in Settings.');
}

/* ---------- iTunes search (JSONP — no CORS needed) ---------- */
function searchiTunes(term){
  return new Promise((resolve, reject) => {
    const cb = '__cb' + Math.random().toString(36).slice(2);
    let done = false;
    const cleanup = () => { delete window[cb]; const s = document.getElementById('itunesScript'); if(s) s.remove(); };
    window[cb] = d => { if(done) return; done = true; cleanup(); resolve(d.results || []); };
    const s = document.createElement('script');
    s.id = 'itunesScript';
    s.src = 'https://itunes.apple.com/search?media=podcast&limit=24&term=' + encodeURIComponent(term) + '&callback=' + cb;
    s.onerror = () => { if(done) return; done = true; cleanup(); reject(new Error('Search failed')); };
    document.head.appendChild(s);
    setTimeout(() => { if(done) return; done = true; cleanup(); reject(new Error('Search timed out')); }, 12000);
  });
}

/* ---------- show management ---------- */
function findShow(feedUrl){ return state.shows.find(s => s.feedUrl === feedUrl); }

async function addShowFromRSS(feedUrl){
  feedUrl = feedUrl.trim();
  if(!/^https?:\/\//i.test(feedUrl)) throw new Error('Feed URL must start with http(s)://');
  const existing = findShow(feedUrl);
  if(existing) return existing.id;                 // already subscribed — just return it
  const { text } = await fetchWithCors(feedUrl);
  const parsed = parseFeed(text, feedUrl);
  const show = {
    id: 's' + Math.random().toString(36).slice(2,9),
    title: parsed.title, author: parsed.author, artwork: parsed.artwork,
    feedUrl, episodes: parsed.episodes,
  };
  state.shows.push(show);
  saveState();
  return show.id;
}
async function refreshShow(id){
  const show = showById(id); if(!show) return;
  const { text } = await fetchWithCors(show.feedUrl);
  const parsed = parseFeed(text, show.feedUrl);
  const byGuid = new Map(show.episodes.map(e => [e.guid, e]));
  show.title = parsed.title; show.author = parsed.author; show.artwork = parsed.artwork || show.artwork;
  parsed.episodes.forEach(ne => {
    const old = byGuid.get(ne.guid);
    if(old) Object.assign(ne, { isPlayed:old.isPlayed, playCount:old.playCount, lastPlayedAt:old.lastPlayedAt, position:old.position });
  });
  show.episodes = parsed.episodes;
  saveState();
}

function queueAudiobookReport(kind, positionSeconds=audio.currentTime, isPaused=audio.paused){
  const client=audiobookClient, chapter=currentAudiobookChapter(), session=audiobookSession;
  if(!client || !chapter || !session?.playSessionId || !session?.mediaSourceId) return Promise.resolve(false);
  const positionTicks=secondsToTicks(positionSeconds);
  if(positionTicks===null) return Promise.resolve(false);
  const safePosition=positionTicks/10000000;
  audiobookReportChain=audiobookReportChain.then(async()=>{
    try{
      if(kind==='started') await client.reportStarted(chapter,session);
      else if(kind==='stopped') await client.reportStopped(chapter,session,safePosition);
      else await client.reportProgress(chapter,session,safePosition,isPaused);
      if(kind!=='started' && client===audiobookClient) refreshHarryPotterBooks();
      return true;
    }catch(error){
      if(client===audiobookClient){
        audiobookError='Jellyfin could not save playback progress';
        renderAll();
      }
      return false;
    }
  });
  return audiobookReportChain;
}
function scheduleAudiobookProgress(){
  cancelAudiobookReportTimer();

  const generation=audiobookPlaybackGeneration;
  audiobookReportTimer=setTimeout(()=>{
    audiobookReportTimer=null;
    queueAudiobookReport('progress',audio.currentTime,false).then(()=>{if(generation===audiobookPlaybackGeneration)scheduleAudiobookProgress()});
  },10000);

async function startAudiobookSession(book,chapter,{positionTicks=chapter.positionTicks||0,autoplay=true}={}){
  if(!audiobookClient) throw new Error('Sign in to Jellyfin first');
  const generation=++audiobookPlaybackGeneration;
  cancelAudiobookReportTimer();
  const oldSession=audiobookSession;
  const oldChapter=currentAudiobookChapter();
  const oldClient=audiobookClient;
  const oldPosition=audio.currentTime;
  if(oldSession && oldChapter && oldClient){
    audiobookReportChain=audiobookReportChain.then(async()=>{
      try{await oldClient.reportStopped(oldChapter,oldSession,Number.isFinite(oldPosition)?oldPosition:null);}catch(e){}
    });
  }
  audiobookActiveBookId=book.id; audiobookActiveChapterId=chapter.id;
  audiobookSession=null;

    navTitle: audiobooksNavTitle || 'Audiobook',
    navParentId: audiobooksNavParentId,

  const userTicks=Number.isFinite(Number(chapter.positionTicks))?Number(chapter.positionTicks):0;
  const startTicks=Math.max(0,Number.isFinite(Number(positionTicks))?Number(positionTicks):userTicks);
  audio.src=buildStreamUrl(audiobookServerUrl,chapter.id,chapter.mediaSourceId || chapter.id);
  audio.playbackRate=speed;
  audio.currentTime=ticksToSeconds(startTicks) || 0;
  audiobookPendingResume={chapterId:chapter.id,seconds:ticksToSeconds(startTicks)||0,generation};
  chapter.positionTicks=startTicks;
  renderAll();
  try{
    const info=await audiobookClient.getPlaybackInfo(chapter);
    if(generation!==audiobookPlaybackGeneration) return;
    const source=info.MediaSources?.find(x=>x.Id===chapter.mediaSourceId) || info.MediaSources?.[0];
    if(!info.PlaySessionId || !source?.Id) throw new Error('PlaybackInfo did not return a session and media source');
    audiobookSession={playSessionId:info.PlaySessionId,mediaSourceId:source.Id};
    await queueAudiobookReport('started',ticksToSeconds(startTicks)||0,false);
  }catch(error){
    if(generation===audiobookPlaybackGeneration){audiobookError=error?.message || 'Could not start Jellyfin playback session';renderAll();}
  }
  if(autoplay){
    try{await audio.play();}catch(error){toast('Playback blocked — tap play');}
  }
  updateMediaSession();renderAll();
}
function playAudiobook(bookId,chapterId,{positionTicks,autoplay=true}={}){
  const chapter = chapterById(bookId, chapterId);
  if(!chapter) return;
  startAudiobookSession({ id: bookId }, chapter, {positionTicks,autoplay});
}
function resumeAudiobook(bookId){
  const chapters = getCurrentChapters(bookId);
  if(!chapters.length) return;
  const resume = audiobookResumeTarget({ items: chapters });
  if(!resume) return;
  playAudiobook(bookId, resume.chapter.id, {positionTicks: resume.positionTicks, autoplay: true});
}
function nextAudiobookChapter(){
  if(sleepTimer && sleepTimer.mode==='end'){try{appendEvent('timer');}catch(e){}pause('sleep');clearSleepTimer();return;}
  const chapter = currentAudiobookChapter();
  if(!chapter) return;
  const chapters = getCurrentChapters();
  if(!chapters.length) return;
  const next = nextChapter(chapters, chapter.id);
  if(!next){
    cancelAudiobookReportTimer();
    const position=audio.currentTime;
    audio.pause();
    if(audiobookSession) queueAudiobookReport('stopped',position,true).then(()=>{audiobookSession=null;});
    toast('End of this book');
    return;
  }
  playAudiobook(audiobookActiveBookId, next.id, {positionTicks:next.positionTicks||0,autoplay:true});
}
function previousAudiobookChapter(){
  const chapter = currentAudiobookChapter();
  if(!chapter) return;
  if(audio.currentTime>5){audio.currentTime=0;return;}
  const chapters = getCurrentChapters();
  const index = chapters.findIndex(ch=>ch.id===chapter.id);
  if(index>0) playAudiobook(audiobookActiveBookId,chapters[index-1].id,{positionTicks:0,autoplay:true});
}
function skipAudiobookChapter(){
  if(audio.currentTime>5){nextAudiobookChapter();return;}
  nextAudiobookChapter();
}
function fmt(sec){
  if(!isFinite(sec) || sec < 0) return '–:––';
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
           : m + ':' + String(s).padStart(2,'0');
}

async function playEpisode(show, ep, {reset=false}={}){
  if(playerMode === 'audiobook'){
    await stopAudiobookSession();
    playerMode='podcast';
    audiobookActiveBookId=null; audiobookActiveChapterId=null; audiobookPendingResume=null;
    audiobookPlaybackGeneration++;
  }
  currentShowId = show.id; currentGuid = ep.guid;
  revokeCachedBlob();
  // Use cached audio if available
  const cached = await getCachedBlobUrl(ep);
  if(cached){
    audio.src = cached;
    cachedBlobUrl = cached;
  } else {
    audio.src = ep.url;
  }
  audio.playbackRate = speed;
  const pos = (!reset && ep.position && isFinite(ep.position)) ? ep.position : 0;
  audio.currentTime = pos;
  markHeard(ep);
  saveState();
  try{ await audio.play(); }catch(e){ toast('Playback blocked — tap play'); }
  updateMediaSession();
  renderAll();
}

function playGuid(showId, guid, opts){
  const show = showById(showId); if(!show) return;
  const ep = show.episodes.find(e => e.guid === guid); if(!ep) return;
  playEpisode(show, ep, opts);
}

function next(){
  if(playerMode === 'audiobook'){ nextAudiobookChapter(); return; }
  const show = showById(currentShowId); if(!show) return;
  if(sleepTimer && sleepTimer.mode === 'end'){ try{appendEvent('timer');}catch(e){} pause('sleep'); clearSleepTimer(); return; }
  const ep = pickEpisode(show, currentGuid);
  if(!ep){ toast('No playable episodes'); return; }
  playEpisode(show, ep);
}

function shuffleNow(showId){
  const show = showById(showId); if(!show) return;
  const ep = pickEpisode(show);
  if(!ep){ toast('No playable episodes in this show'); return; }
  playEpisode(show, ep);
}

function shuffleAll(){
  const pick = pickAcrossShows();
  if(!pick || !pick.ep){ toast('No playable episodes'); return; }
  playEpisode(pick.show, pick.ep);
}

function pause(reason){
  if(playerMode==='audiobook'){
    const position=audio.currentTime;
    cancelAudiobookReportTimer();
    if(audiobookSession) queueAudiobookReport('progress',position,true);
  }
  audio.pause();
  if(navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
  renderAll();
}

function togglePlay(){
  if(audio.paused){
    audio.play().then(()=>{if(playerMode==='audiobook' && audiobookSession){queueAudiobookReport('progress',audio.currentTime,false);scheduleAudiobookProgress();}}).catch(()=>{});
    if(navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
  }
  else pause();
  renderAll();
}

function skipCurrent(){
  if(playerMode==='audiobook'){skipAudiobookChapter();return;}
  const ep = current(); if(ep) markHeard(ep);
  saveState(); next();
}

/* ---------- media session (lock screen / notification controls) ---------- */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const ep = current(); const show = currentShow();
  if(!ep || !show) return;
  const audiobook = playerMode === 'audiobook';
  const ms = navigator.mediaSession;
  const art = !audiobook && show.artwork ? [{ src: show.artwork, sizes: '512x512', type: 'image/jpeg' }] : [];
  ms.metadata = new MediaMetadata({ title: ep.title || 'Episode', artist: audiobook ? show.title : (show.title || 'Podcast'), album: audiobook ? 'Caster Audiobooks' : 'Caster', artwork: art });
  ms.playbackState = audio.paused ? 'paused' : 'playing';
  ms.setActionHandler('play', () => togglePlay());
  ms.setActionHandler('pause', () => pause());
  ms.setActionHandler('previoustrack', () => {
    if(playerMode === 'audiobook'){ previousAudiobookChapter(); return; }
    const episode = current(); if(episode && audio.currentTime > 5) audio.currentTime = 0; else if(episode) playEpisode(currentShow(), episode, {reset:true});
  });
  ms.setActionHandler('nexttrack', () => playerMode === 'audiobook' ? nextAudiobookChapter() : skipCurrent());
  ms.setActionHandler('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 15)); });
  ms.setActionHandler('seekforward', d => { audio.currentTime = Math.min(audio.duration||1e9, audio.currentTime + (d.seekOffset || 30)); });
  ms.setActionHandler('seekto', d => { if(d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; });
  const push = () => { try{ ms.setPositionState({ duration: audio.duration || 0, position: audio.currentTime || 0, playbackRate: audio.playbackRate }); }catch(e){} };
  push(); setTimeout(push, 500);
}

/* ---------- sleep timer ---------- */
function setSleepTimer(mode, ms){
  sleepTimer = mode === 'end' ? {mode:'end'} : {mode:'minutes', at: now(), ms};
  if(sleepTimer.mode === 'minutes') setTimeout(() => { if(sleepTimer && sleepTimer.mode === 'minutes' && now() >= sleepTimer.at + sleepTimer.ms) { try{ appendEvent('timer'); }catch(e){} pause('sleep'); clearSleepTimer(); } }, Math.min(ms, 2**31-1));
  renderAll();
}
function clearSleepTimer(){ sleepTimer = null; renderAll(); }
function sleepLabel(){
  if(!sleepTimer) return 'off';
  if(sleepTimer.mode === 'end') return 'end of ep';
  return Math.max(1, Math.ceil((sleepTimer.at + sleepTimer.ms - now())/60000)) + 'm';
}

// Sleep summary for the morning card
const SLEEP_DISMISS_KEY = 'caster.sleep.dismissed';
function getLastNightSummary(){
  const events = loadEvents();
  if(!events.length) return null;
  const nights = groupEventsByNight(events);
  const now = Date.now();
  const todayKey = localDate(now);
  const todayHours = new Date(now).getHours();
  // Find the most recent night that is not today
  const sortedKeys = [...nights.keys()].sort();
  const lastKey = sortedKeys.findLast(k => k !== todayKey) || null;
  if(!lastKey) return null;
  // Only show in the morning window (4:00–12:00)
  if(todayHours < 4 || todayHours >= 12) return null;
  // Check dismiss
  try{
    const dismissed = localStorage.getItem(SLEEP_DISMISS_KEY);
    if(dismissed === todayKey) return null;
  }catch(e){}
  const result = analyzeNight(nights.get(lastKey));
  if(!result || !result.awakenings) return null;
  return { date: lastKey, summary: summarizeNight(result), analysis: result };
}

    const guid = el.dataset.guid;

    if(dlBtn) dlBtn.addEventListener('click', e => {
      e.stopPropagation();
      const ep = show.episodes.find(e => e.guid === guid);
      if(!ep) return;
      if(isDownloaded(guid)) removeDownload(ep);
      else startDownload(ep);
    });
    el.addEventListener('click', () => playGuid(show.id, guid));
  });
}

function renderPlayerBar(){
  const bar = $('#pbar');
  const ep = current();
  if(!ep){ bar.style.display = 'none'; return; }
  const show = currentShow();
  bar.style.display = 'block';
  const isBook = playerMode === 'audiobook';
  const art = isBook ? audiobookArtUrl() : (show?.artwork || '');
  $('#pbarArt').style.visibility = art ? 'visible' : 'hidden';
  if(art) $('#pbarArt').src = art;
  $('#pbarTitle').textContent = ep.title || '';
  $('#pbarShow').textContent = isBook ? `${show?.title || 'Harry Potter'} · Chapter ${ep.chapterNumber}` : (show?.title || '');
  $('#pbarCached').style.display = !isBook && isDownloaded(ep.guid) ? '' : 'none';
  $('#pbarPlay').textContent = audio.paused ? '▶' : '❚❚';
  $('#pbarSkip').style.display = isBook ? 'none' : '';
  $('#pbarPrev').style.display = isBook ? '' : 'none';
  $('#pbarPrev').title = isBook ? 'Previous chapter' : '';
  $('#pbarSkip').title = isBook ? 'Next chapter' : 'Skip to a new random episode';
}

function renderOverlay(){
  const ep = current(); const open = $('#overlay').classList.contains('open');
  if(!ep){ $('#overlay').classList.remove('open'); return; }
  const show = currentShow();
  const isBook = playerMode === 'audiobook';
  const art = isBook ? audiobookArtUrl() : (show?.artwork || '');
  $('#ovArt').style.visibility = art ? 'visible' : 'hidden';
  if(art) $('#ovArt').src = art;
  $('#ovTitle').textContent = ep.title || '';
  $('#ovShow').textContent = isBook ? `${show?.title || 'Harry Potter'} · Chapter ${ep.chapterNumber}` : (show?.title || '');
  $('#ovPlay').textContent = audio.paused ? '▶' : '❚❚';
  $('#ovNext').setAttribute('aria-label', isBook ? 'Next chapter' : 'Skip to a new random episode');
  $('#ovPrev').style.display = isBook ? '' : 'none';
  $('#restartChip').textContent = isBook ? '↺ Restart chapter' : '↺ Restart ep';
  $('#markHeardChip').style.display = isBook ? 'none' : '';
  $('#speedChip').textContent = speed + '×';
  if(isBook) applyAudiobookResumePosition();
  else audiobookPendingResume = null;
  const dur = audio.duration || ep.duration || 0;
  const pct = dur ? audio.currentTime/dur*100 : 0;
  $('#ovFill').style.width = pct + '%';
  $('#ovKnob').style.left = pct + '%';
  $('#pbarFill').style.width = pct + '%';
  $('#ovCur').textContent = fmt(audio.currentTime);
  $('#ovDur').textContent = fmt(dur);
  lastProgress = audio.currentTime;
}

function renderSleepChip(){
  $('#sleepChip').textContent = '⏾ ' + sleepLabel();
  $('#sleepChip').classList.toggle('on', !!sleepTimer);
  $('#ovSleep').textContent = '⏾ ' + sleepLabel();
  $('#ovSleep').classList.toggle('on', !!sleepTimer);
}

/* ---------- modals ---------- */
function openModal(title, bodyHtml, after){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modal').classList.add('open');
  if(after) after();
}
function closeModal(){ $('#modal').classList.remove('open'); }

function openAddModal(){
  openModal('Add a show', `
    <div class="seg" id="addSeg">
      <button class="on" data-tab="search">Search</button>
      <button data-tab="rss">RSS link</button>
    </div>
    <div id="addPane"></div>`, () => {
    const seg = $('#addSeg');
    const pane = $('#addPane');
    const showTab = which => {
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === which));
      pane.innerHTML = which === 'search'
        ? `<input type="search" id="searchInput" placeholder="Search Apple Podcasts… e.g. The Flophouse">
           <div class="searchres" id="searchRes"></div>`
        : `<input type="url" id="rssInput" placeholder="https://…/feed.xml">
           <button class="chip primary" id="rssGo" style="width:100%">Add show</button>
           <p class="hint" style="margin-top:8px">Paste any podcast RSS feed — including private Patreon audio feeds.</p>`;
      if(which === 'search'){
        const inp = $('#searchInput');
        let t;
        inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(doSearch, 350); });
        inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ clearTimeout(t); doSearch(); } });
        async function doSearch(){
          const q = inp.value.trim(); if(q.length < 2) return;
          const res = $('#searchRes'); res.innerHTML = '<div class="muted small">Searching…</div>';
          try{
            const hits = await searchiTunes(q);
            res.innerHTML = hits.length ? hits.map(h => `
              <div class="sr" data-feed="${esc(h.feedUrl)}">
                <img src="${esc(h.artworkUrl100||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                <div style="flex:1;min-width:0"><div class="t">${esc(h.collectionName)}</div><div class="s">${esc(h.artistName||'')}</div></div>
              </div>`).join('') : '<div class="muted small">No results.</div>';
            res.querySelectorAll('.sr').forEach(el => el.addEventListener('click', async () => {
              el.style.opacity = '.5';
              try{ const id = await addShowFromRSS(el.dataset.feed); closeModal(); toast('Added ✓'); showById(id) && (currentShowId = id); renderAll(); }
              catch(err){ toast('Could not add that show'); el.style.opacity = '1'; }
            }));
          }catch(e){ res.innerHTML = '<div class="muted small">Search failed — check your connection.</div>'; }
        }
      } else {
        $('#rssGo').addEventListener('click', async () => {
          const val = $('#rssInput').value.trim(); if(!val) return;
          try{
            const id = await addShowFromRSS(val);
            closeModal(); toast('Added ✓');
            showById(id) && (currentShowId = id); renderAll();
          }catch(err){ toast(err.message || 'Could not add that show'); }
        });
      }
    };
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
    showTab('search');
  });
}

function openSettingsModal(){
  const s = state.settings;
  openModal('Settings', `
    <label class="f">Old favourites resurface after (freshness)</label>
    <input type="range" id="freshRange" min="7" max="365" step="1" value="${s.freshness}">
    <p class="hint" id="freshLabel">~${s.freshness} days since last heard → back to full strength</p>
    <label class="f">Don't repeat within</label>
    <input type="range" id="guardRange" min="1" max="24" step="1" value="${s.repeatGuardHours}">
    <p class="hint" id="guardLabel">${s.repeatGuardHours} hour(s) — stops the same episode coming back tonight</p>
    <label class="f">Custom CORS proxy (optional — e.g. your own Mini proxy)</label>
    <input type="text" id="proxyInput" placeholder="https://…/fetch?url=" value="${esc(s.customProxy)}">
    <p class="hint">Leave blank for auto (direct → allorigins → corsproxy). Point at your own proxy to keep feed fetches private.</p>
    <p class="hint" id="bundledDate">${state.bundledUpdated ? 'Bundled show data: updated ' + esc(new Date(state.bundledUpdated).toLocaleDateString()) + '.' : ''}</p>
    <div id="sleepTrend"></div>
  `, () => {
    const fresh = $('#freshRange'), guard = $('#guardRange');
    fresh.addEventListener('input', () => { state.settings.freshness = +fresh.value; $('#freshLabel').textContent = '~' + fresh.value + ' days since last heard → back to full strength'; saveState(); });
    guard.addEventListener('input', () => { state.settings.repeatGuardHours = +guard.value; $('#guardLabel').textContent = guard.value + ' hour(s) — stops the same episode coming back tonight'; saveState(); });
    $('#proxyInput').addEventListener('change', e => { state.settings.customProxy = e.target.value.trim(); saveState(); });
    const bd = $('#bundledDate');
    if(bd && state.bundledUpdated) bd.textContent = 'Bundled show data: updated ' + new Date(state.bundledUpdated).toLocaleDateString() + ' — run refresh_feeds.py and push to refresh.';
    renderSleepTrend();
  });
}

/* ---------- sleep trend (last 7 nights, from playback interaction log) ---------- */
function renderSleepTrend(){
  const el = $('#sleepTrend');
  if(!el) return;
  const events = loadEvents();
  pruneOldEvents();
  const nights = groupEventsByNight(events);
  if(!nights.size){
    el.innerHTML = `<p class="hint">No sleep tracking data yet — use the sleep timer and play in the evening; Caster records playback-free quiet periods.</p>`;
    return;
  }
  const sorted = [...nights.keys()].sort();
  const recent = sorted.slice(-7).reverse();
  const rows = recent.map(key => {
    const analysis = analyzeNight(nights.get(key));
    if(!analysis) return null;
    const a = analysis.awakenings;
    return `<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span class="muted mono" style="width:70px;flex:none">${key.slice(5)}</span><div style="flex:1;background:var(--surface2);border-radius:4px;height:14px;overflow:hidden"><div style="width:${Math.min(100, a * 20)}%;height:100%;background:var(--accent);border-radius:4px"></div></div><span class="mono" style="width:24px;text-align:right">${a}</span></div>`;
  }).filter(Boolean).join('');
  el.innerHTML = `<label class="f">Estimated awakenings — last 7 nights</label>${rows}<p class="hint">From Caster tap/timer times only (local, on-device). Empty bar = no night listening.</p>`;
}

/* ---------- sleep sheet ---------- */
function openSleepSheet(){
  openModal('Sleep timer', `
    <div class="pillrow">
      <button class="chip ${sleepTimer && sleepTimer.mode==='end' ? 'on' : ''}" data-sleep="end">End of episode</button>
      <button class="chip ${sleepTimer && sleepTimer.mode==='minutes' && sleepTimer.ms===15*6e4 ? 'on' : ''}" data-sleep="15">15 min</button>
      <button class="chip ${sleepTimer && sleepTimer.mode==='minutes' && sleepTimer.ms===30*6e4 ? 'on' : ''}" data-sleep="30">30 min</button>
      <button class="chip ${sleepTimer && sleepTimer.mode==='minutes' && sleepTimer.ms===45*6e4 ? 'on' : ''}" data-sleep="45">45 min</button>
      <button class="chip ${sleepTimer && sleepTimer.mode==='minutes' && sleepTimer.ms===60*6e4 ? 'on' : ''}" data-sleep="60">60 min</button>
      <button class="chip ${sleepTimer && sleepTimer.mode==='minutes' && sleepTimer.ms===90*6e4 ? 'on' : ''}" data-sleep="90">90 min</button>
      <button class="chip" data-sleep="off">Off</button>
    </div>
    <p class="hint">On Android, Caster keeps playing with the screen locked. For automatic pause-when-asleep, /e/OS battery tools or an app like Sleep Timer can also stop playback — or just set 45 minutes and drift off.</p>
  `, () => {
    $('#modalBody').querySelectorAll('[data-sleep]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.sleep;
      if(v === 'off') clearSleepTimer();
      else if(v === 'end') setSleepTimer('end');
      else setSleepTimer('minutes', +v * 6e4);
      closeModal(); renderAll(); toast('Sleep: ' + sleepLabel());
    }));
  });
}

/* ---------- events ---------- */
audio.addEventListener('ended', next);
audio.addEventListener('timeupdate', () => {
  if(playerMode === 'audiobook'){
    if(now() - lastProgress > 700){renderOverlay();lastProgress=now();}
    if(now() - lastPosSave > 10000 && audiobookSession && !audio.paused){
      lastPosSave=now();
      queueAudiobookReport('progress',audio.currentTime,false).then(()=>{if(!audio.paused)scheduleAudiobookProgress()});
    }
    return;
  }
  markPlayedIfDone();
  if(now() - lastProgress > 500){ renderOverlay(); lastProgress = now(); }
  if(now() - lastPosSave > 4000){ lastPosSave = now(); const ep = current(); if(ep){ ep.position = audio.currentTime; saveState(); } }
});
audio.addEventListener('play', () => { if(navigator.mediaSession) navigator.mediaSession.playbackState = 'playing'; renderPlayerBar(); renderOverlay(); if(playerMode==='audiobook') scheduleAudiobookProgress(); try{ appendEvent('play'); }catch(e){} });
audio.addEventListener('pause', () => { if(navigator.mediaSession) navigator.mediaSession.playbackState = 'paused'; renderPlayerBar(); renderOverlay(); if(playerMode==='audiobook') cancelAudiobookReportTimer(); });
audio.addEventListener('loadedmetadata', () => { applyAudiobookResumePosition(); updateMediaSession(); renderOverlay(); });
window.addEventListener('pagehide', () => {
  if(playerMode==='audiobook'){
    const chapter=currentAudiobookChapter();
    if(chapter && Number.isFinite(audio.currentTime)) queueAudiobookReport('stopped',audio.currentTime,true)
    return;
  }
  const ep = current(); if(ep){ ep.position = audio.currentTime; saveState(); }
});

// Resume playback after mobile browser tab suspension (screen lock / backgrounding)
window.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(playerMode !== 'audiobook' || !audiobookSession) return;
  // Audio may have been paused by the browser during background; resume if it was actively playing
  if(audio.paused && audio.currentTime > 0 && !audio.ended){
    audio.play().catch(() => {});  // may fail without user gesture on some mobile browsers
  }
});
window.addEventListener('pageshow', (e) => {
  if(!e.persisted || playerMode !== 'audiobook') return;
  // Restored from bfcache — audio state is gone, refresh from server position
  const book = bookById(audiobookActiveBookId);
  if(!book || !audiobookActiveChapterId) return;
  const chapter = chapterById(book.id, audiobookActiveChapterId);
  if(!chapter) return;
  audiobookSession = null;
  startAudiobookSession(book, chapter, {positionTicks: chapter.positionTicks, autoplay: false});
});


setInterval(() => { if(sleepTimer) renderSleepChip(); }, 30000);

$('#addBtn').addEventListener('click', openAddModal);
$('#setBtn').addEventListener('click', openSettingsModal);
$('#sleepChip').addEventListener('click', openSleepSheet);
$('#modalClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if(e.target === $('#modal')) closeModal(); });

$('#pbarOpen').addEventListener('click', () => $('#overlay').classList.add('open'));
$('#ovClose').addEventListener('click', () => $('#overlay').classList.remove('open'));
$('#pbarPlay').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('#pbarSkip').addEventListener('click', e => { e.stopPropagation(); skipCurrent(); });
$('#pbarPrev').addEventListener('click', e => { e.stopPropagation(); previousAudiobookChapter(); });
$('#ovPlay').addEventListener('click', togglePlay);
$('#ovNext').addEventListener('click', skipCurrent);
$('#ovPrev').addEventListener('click', previousAudiobookChapter);
$('#booksBtn').addEventListener('click', openAudiobookView);
$('#back15').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
$('#fwd30').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||1e9, audio.currentTime + 30); });
$('#restartChip').addEventListener('click', () => {
  if(playerMode==='audiobook'){const chapter=currentAudiobookChapter(),book=bookById(audiobookActiveBookId);if(chapter&&book)playAudiobook(book.id,chapter.id,{positionTicks:0});return;}
  const ep=current();if(ep)playEpisode(currentShow(),ep,{reset:true});
});
$('#markHeardChip').addEventListener('click', () => { const ep = current(); if(ep){ markHeard(ep); saveState(); toast('Marked heard — it will fade for a while'); renderAll(); } });
$('#speedChip').addEventListener('click', () => {
  const speeds = [1, 1.2, 1.5, 2, 0.8];
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  audio.playbackRate = speed;
  try{ localStorage.setItem('caster.speed', speed); }catch(e){}
  try{ navigator.mediaSession && navigator.mediaSession.setPositionState({ duration: audio.duration||0, position: audio.currentTime||0, playbackRate: speed }); }catch(e){}
  renderOverlay();
});
$('#ovSleep').addEventListener('click', openSleepSheet);

/* seek track */
(function(){
  const track = $('#track');
  let dragging = false;
  function seekFrom(e){
    const r = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const dur = audio.duration || 0;
    if(dur) audio.currentTime = frac * dur;
  }
  track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); seekFrom(e); });
  track.addEventListener('pointermove', e => { if(dragging) seekFrom(e); });
  track.addEventListener('pointerup', () => { dragging = false; });
})();

/* ---------- expose a small API (testing & future automation) ---------- */
window.caster = {
  state, saveState, parseFeed, fetchWithCors, addShowFromRSS, refreshShow, loadBundledShows, renderAll,
  episodeWeight, pickEpisode, pickAcrossShows, markHeard, markPlayedIfDone,
  playEpisode, playGuid, shuffleNow, shuffleAll, next, skipCurrent, togglePlay,
  searchiTunes, current, showById, unplayedCount,
  startDownload, removeDownload, downloadRandomBatch, isDownloaded, dlState,
  sleep: { appendEvent, loadEvents, groupEventsByNight, analyzeNight, summarizeNight },
};

renderAll();
loadBundledShows().then(renderAll);
// Try to restore a saved Jellyfin session without requiring a fresh sign-in
tryResumeJellyfinSession();
</script>
