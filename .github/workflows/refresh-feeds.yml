name: Refresh podcast feeds

on:
  schedule:
    # Daily at 06:00 UTC — catches overnight episode drops
    - cron: '0 6 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh feeds
        run: python3 refresh_feeds.py

      - name: Commit and push if changed
        run: |
          git config user.name 'caster-feed-refresh[bot]'
          git config user.email 'caster-feed-refresh[bot]@users.noreply.github.com'
          git add feeds.json
          if git diff --cached --quiet; then
            echo "No changes — no new episodes"
            exit 0
          fi
          git commit -m "Auto-refresh podcast feeds [skip ci]"
          git push